name: Deploy to Hostinger FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Carimba ?v=<sha> nas referências locais de JS/CSS para furar o cache
      # do CDN (Cloudflare/Hostinger) e dos navegadores a cada deploy.
      # URLs externas (contêm ":") não são alteradas.
      - name: Cache-bust de assets JS/CSS
        run: |
          VERSION="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' \
            -exec sed -i -E "s/(src|href)=\"([^\":]*\.(js|css))\"/\1=\"\2?v=${VERSION}\"/g" {} +

      # O FTP da Hostinger sofre timeouts intermitentes de conexão;
      # timeout maior + retry automático evitam deploys perdidos em silêncio.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore

      - name: Aguardar antes do retry
        if: steps.ftp1.outcome == 'failure'
        run: sleep 90

      - name: Deploy via FTP (retry)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore
